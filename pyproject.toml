[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-evidence-mcp"
version = "0.1.0"
description = "Evidence-aware code context MCP server for deterministic change-impact analysis."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
code-evidence-mcp = "code_evidence_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
